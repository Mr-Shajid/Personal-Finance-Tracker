<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="userauth.css">
</head>
<body>

  <div id="authApp">

    <!-- Signup Screen -->
    <div id="signupScreen" class="screen">
      <h2>Signup</h2>
      <input type="text" id="signupName" placeholder="Name">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <button onclick="signup()">Register</button>
      <p>Already have an account? <a href="#" onclick="showScreen('loginScreen')">Login</a></p>
    </div>

    <!-- Email Verification -->
    <div id="verifyScreen" class="screen" style="display:none;">
      <h2>Email Verification</h2>
      <p>Click the button to verify your email.</p>
      <button onclick="verifyEmail()">Verify Email</button>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen" style="display:none;">
      <h2>Login</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="login()">Login</button>
      <p><a href="#" onclick="showScreen('forgotScreen')">Forgot Password?</a></p>
      <p>New user? <a href="#" onclick="showScreen('signupScreen')">Signup</a></p>
    </div>

    <!-- Forgot Password -->
    <div id="forgotScreen" class="screen" style="display:none;">
      <h2>Forgot Password</h2>
      <input type="email" id="forgotEmail" placeholder="Your registered email">
      <button onclick="simulatePasswordReset()">Send Reset Link</button>
      <p><a href="#" onclick="showScreen('loginScreen')">Back to Login</a></p>
    </div>

    <!-- Reset Password -->
    <div id="resetScreen" class="screen" style="display:none;">
      <h2>Reset Password</h2>
      <input type="password" id="newPassword" placeholder="New Password">
      <button onclick="resetPassword()">Reset</button>
    </div>

    <!-- Home (After Login) -->
    <div id="homeScreen" class="screen" style="display:none;">
      <h2>Welcome, <span id="username"></span></h2>
      <button onclick="logout()">Logout</button>
    </div>

  </div>

  <script src="userauth.js"></script>
</body>
</html>
