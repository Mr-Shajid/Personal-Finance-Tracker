<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Reminders - Personal Finance Tracker</title>
  <link rel="stylesheet" href="billreminderstyle.css">
</head>
<body>
    <!-- Hamburger Menu -->
     <div class="hamburger" id="hamburger">&#9776;</div>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>Personal Finance Tracker</h2>
    <div class="nav-item">Dashboard</div>
    <div class="nav-item">Expenses</div>
    <div class="nav-item">Income</div>
    <div class="nav-item">Goals</div>
    <div class="nav-item">Debts</div>
    <div class="nav-item">Bill Reminders</div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>Bill Reminders</h1>
    <div class="content">
      <!-- Calendar -->
      <div class="calendar">
        <h3>August 2025</h3>
        <table>
          <tr>
            <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
            <th>Thu</th><th>Fri</th><th>Sat</th>
          </tr>
          <tr>
            <td></td><td></td><td></td><td></td><td>1</td><td>2</td><td>3</td>
          </tr>
          <tr>
            <td>4</td><td>5</td><td class="due">6</td><td>7</td><td>8</td><td>9</td><td>10</td>
          </tr>
          <tr>
            <td>11</td><td>12</td><td>13</td><td>14</td><td class="due">15</td><td>16</td><td>17</td>
          </tr>
          <tr>
            <td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td>
          </tr>
          <tr>
            <td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td><td>31</td>
          </tr>
        </table>
      </div>

      <!-- Upcoming Bills -->
      <div>
        <div class="bills">
          <h3>Upcoming Bills</h3>
          <div class="bill">
            <div class="info">Electricity – Aug 15 – $80</div>
            <button class="pay-btn">Pay Now</button>
          </div>
          <div class="bill">
            <div class="info">Internet – Aug 20 – $40</div>
            <button class="pay-btn">Pay Now</button>
          </div>
          <div class="bill">
            <div class="info">Rent – Sep 1 – $500</div>
            <button class="pay-btn">Pay Now</button>
          </div>
        </div>

        <!-- Notification Settings -->
        <div class="notifications">
          <h3>Reminders</h3>
          <label><input type="checkbox" id="emailNotify" checked> Email Notifications</label>
          <label><input type="checkbox" id="appNotify" checked> In-App Notifications</label>
          <label><input type="checkbox" id="smsNotify"> SMS Notifications</label>
        </div>
      </div>
    </div>
  </div>

  <script src="billreminderscript.js"></script>
</body>
</html>
