<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Manager</title>
  <link rel="stylesheet" href="expense.css"/>
</head>
<body>

  <h1>Expense Manager</h1>

  <div class="tabs">
    <button onclick="showScreen('category')">Category Manager</button>
    <button onclick="showScreen('tagger')">Transaction Tagger</button>
    <button onclick="showScreen('rules')">Custom Rule Creator</button>
  </div>

  <!-- Category Manager -->
  <div id="category" class="screen">
    <h2>Category Manager</h2>
    <form onsubmit="addCategory(event)">
      <input type="text" id="categoryInput" placeholder="New Category" required />
      <button type="submit">Add</button>
    </form>
    <ul id="categoryList"></ul>
  </div>

  <!-- Transaction Tagger -->
  <div id="tagger" class="screen" style="display:none">
    <h2>Transaction Tagger</h2>
    <div id="transactions"></div>
  </div>

  <!-- Custom Rule Creator -->
  <div id="rules" class="screen" style="display:none">
    <h2>Custom Rule Creator</h2>
    <form onsubmit="addRule(event)">
      <input type="text" id="ruleKeyword" placeholder="Keyword (e.g. Uber)" required />
      <select id="ruleCategory"></select>
      <button type="submit">Create Rule</button>
    </form>
    <ul id="ruleList"></ul>
  </div>

  <script src="expense.js"></script>
</body>
</html>
