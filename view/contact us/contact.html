<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <div class="container" id="contactForm">
    <h2>Contact Us</h2>
    <form onsubmit="submitForm(event)">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Message" required></textarea>

      <div class="captcha">
        <span id="captchaQuestion"></span>
        <input type="text" id="captchaAnswer" placeholder="Answer" required>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <div class="container" id="confirmationScreen" style="display:none;">
    <h2>Thank You!</h2>
    <p>Your message has been submitted. We'll get back to you shortly.</p>
  </div>

  <script src="contact.js"></script>
</body>
</html>
