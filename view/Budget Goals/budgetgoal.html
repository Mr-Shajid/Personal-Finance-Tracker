<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Goals </title>
    <link rel="stylesheet" href="./styleMBG.css">
</head>

<body>
    <div class="title">
        <h1>Monthly Budget Goals </h1>
    </div>
    <div class="main">
        <div class="left">
            <div class="form">
                <h3> Set your monthly Goal</h3>

                <form action="">
                    <table>
                        <tr>
                            <td>Transportation: </td>
                            <td><input type="text" name="" id="Transportation"></td>
                        </tr>
                        <tr>
                            <td>Food: </td>
                            <td><input type="text" name="" id="Food"></td>
                        </tr>
                        <tr><td>Accomadtion:</td>
                            <td><input type="text" name="" id="Accomadtion"></td>
                        </tr>
                        <tr>
                            <td>Hobby: </td>
                            <td><input type="text" name="" id="Hobby"></td>
                        </tr>
                        <tr>
                            <td>month: </td>
                            <td><input type="month" name="month" id="month"></td>
                            
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="submit" value="Enter" id="buttons">
                            </td>
                        </tr>
                    </table>

                </form>
            </div>
        </div>
        <div class="right">
            <div class="Infografic">
                <div class="travel"> Travel</div>
                <div class="food">Food</div>
                <div class="accomadation">Accomadtion</div>
                <div class="hobby">Hobby</div>
                
            </div>
        </div>
    </div>

</body>

</html>
