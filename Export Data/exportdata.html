<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Data - Personal Finance Tracker</title>
  <link rel="stylesheet" href="exportdata.css">
</head>
<body>
  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">&#9776;</div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>Personal Finance Tracker</h2>
    <div class="nav-item"><a href="../Bill Reminder/billreminder.html">Bill Reminders</a></div>
    <div class="nav-item"><a href="../Savings Goals/savings.html">Goals</a></div>
    <div class="nav-item"><a href="../Export Data/exportdata.html">Export Data</a></div>
    <div class="nav-item"><a href="../Role base Access/roleaccess.html">Role Based Access</a></div>
    <div class="nav-item"><a href="../Activity Logs/activitylogs.html">Activity Log</a></div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>Export Data</h1>
    <div class="content">

      <!-- Export Wizard -->
      <div class="card">
        <h3>Export Wizard</h3>
        <button class="btn">Start Export</button>
      </div>

      <!-- Format Selector -->
      <div class="card">
        <h3>Format Selector</h3>
        <select class="select">
          <option>CSV</option>
          <option>PDF</option>
          <option>QBO</option>
        </select>
      </div>

      <!-- Archive Manager -->
      <div class="card">
        <h3>Archive Manager</h3>
        <button class="btn">View Archives</button>
      </div>

      <!-- Options -->
      <div class="card">
        <h3>Options</h3>
        <label><input type="checkbox" checked> Schedule Automatic Backups</label><br>
        <label><input type="checkbox"> Encrypt Sensitive Exports</label>
      </div>

      <!-- Export Button -->
      <div class="card">
        <button class="btn export-btn">Download Export</button>
      </div>
    </div>
  </div>

  <script src="exportdata.js"></script>
</body>
</html>
